<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCB API v2 Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: #f5f5f5;
        }
        .result {
            background: white;
            padding: 20px;
            border-radius: 8px;
            margin: 20px 0;
        }
        pre {
            background: #2c3e50;
            color: #ecf0f1;
            padding: 15px;
            border-radius: 5px;
            overflow-x: auto;
        }
        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background: #5568d3;
        }
        .success { color: #27ae60; }
        .error { color: #e74c3c; }
    </style>
</head>
<body>
    <h1>🧪 SCB API v2 Test - Karlskoga</h1>
    
    <button onclick="testAPI()">Testa API-anrop</button>
    
    <div id="status" class="result"></div>
    <div id="result" class="result"></div>

    <script>
        async function testAPI() {
            const statusDiv = document.getElementById('status');
            const resultDiv = document.getElementById('result');
            
            statusDiv.innerHTML = '<p>⏳ Testar API...</p>';
            
            // Test 1: Enklaste möjliga query
            const url = 'https://statistikdatabasen.scb.se/api/v2/tables/TAB6471/data';
            
            const query = {
                "query": [
                    {
                        "code": "Region",
                        "selection": {
                            "filter": "item",
                            "values": ["1883"]
                        }
                    },
                    {
                        "code": "ContentsCode",
                        "selection": {
                            "filter": "item",
                            "values": ["000007SF"]
                        }
                    },
                    {
                        "code": "Kon",
                        "selection": {
                            "filter": "item",
                            "values": ["TotSa"]
                        }
                    },
                    {
                        "code": "Alder",
                        "selection": {
                            "filter": "item",
                            "values": ["tot"]
                        }
                    },
                    {
                        "code": "Tid",
                        "selection": {
                            "filter": "top",
                            "values": [12]
                        }
                    }
                ],
                "response": {
                    "format": "json-stat2"
                }
            };
            
            console.log('📤 Skickar query:', JSON.stringify(query, null, 2));
            
            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(query)
                });
                
                console.log('📨 Response status:', response.status);
                console.log('📨 Response headers:', [...response.headers.entries()]);
                
                if (!response.ok) {
                    const errorText = await response.text();
                    console.error('❌ Error response:', errorText);
                    statusDiv.innerHTML = `<p class="error">❌ Fel: HTTP ${response.status}</p>`;
                    resultDiv.innerHTML = `<pre>${errorText}</pre>`;
                    return;
                }
                
                const data = await response.json();
                console.log('✅ Data mottagen:', data);
                
                // Extrahera senaste befolkningsvärde
                const latestValue = data.value[data.value.length - 1];
                const latestTime = Object.keys(data.dimension.Tid.category.index).pop();
                
                statusDiv.innerHTML = `
                    <p class="success">✅ API fungerar!</p>
                    <p><strong>Karlskoga befolkning ${latestTime}:</strong> ${latestValue.toLocaleString('sv-SE')} invånare</p>
                `;
                
                resultDiv.innerHTML = `
                    <h3>📊 Fullständig data:</h3>
                    <pre>${JSON.stringify(data, null, 2)}</pre>
                `;
                
            } catch (error) {
                console.error('❌ Fetch error:', error);
                statusDiv.innerHTML = `<p class="error">❌ Fel: ${error.message}</p>`;
                resultDiv.innerHTML = `<pre>${error.stack}</pre>`;
            }
        }
        
        // Auto-test vid laddning
        console.log('🌟 SCB API v2 Test');
        console.log('Öppna console (F12) för detaljerad loggning');
    </script>
</body>
</html>
