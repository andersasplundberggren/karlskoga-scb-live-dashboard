<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎉 SCB API v2 - FUNGERAR!</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1000px;
            margin: 50px auto;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        h1 {
            color: #667eea;
            text-align: center;
        }
        .result {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            margin: 20px 0;
        }
        pre {
            background: #2c3e50;
            color: #ecf0f1;
            padding: 15px;
            border-radius: 5px;
            overflow-x: auto;
            max-height: 300px;
            overflow-y: auto;
        }
        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
            margin: 10px 0;
        }
        button:hover {
            background: #5568d3;
        }
        .success { 
            color: #27ae60; 
            font-weight: bold;
            font-size: 1.2em;
        }
        .error { 
            color: #e74c3c; 
            font-weight: bold; 
        }
        .population {
            font-size: 2em;
            color: #667eea;
            font-weight: bold;
            text-align: center;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎉 Det fungerar nu!</h1>
        <p style="text-align: center; color: #666;">SCB API v2 med korrekta variabelnamn</p>
        
        <button onclick="hämtaKarlskogaData()">📊 Hämta Karlskoga befolkningsdata</button>
        
        <div id="status" class="result" style="display: none;"></div>
        <div id="result" class="result" style="display: none;"></div>
    </div>

    <script>
        async function hämtaKarlskogaData() {
            const statusDiv = document.getElementById('status');
            const resultDiv = document.getElementById('result');
            
            statusDiv.style.display = 'block';
            resultDiv.style.display = 'block';
            statusDiv.innerHTML = '<p>⏳ Hämtar data från SCB...</p>';
            
            const url = 'https://statistikdatabasen.scb.se/api/v2/tables/TAB6471/data';
            
            // KORREKT query med rätt variabelnamn från JSON-stat2!
            const query = {
                "query": [
                    {
                        "code": "Region",  // Stor bokstav!
                        "selection": {
                            "filter": "item",
                            "values": ["1883"]  // Karlskoga
                        }
                    },
                    {
                        "code": "Alder",  // Stor bokstav, inget å!
                        "selection": {
                            "filter": "item",
                            "values": ["TotSA"]  // Viktigt: TotSA med stort A!
                        }
                    },
                    {
                        "code": "Kon",  // Stor bokstav, inget ö!
                        "selection": {
                            "filter": "item",
                            "values": ["TotSa"]  // Samtliga män och kvinnor
                        }
                    },
                    {
                        "code": "ContentsCode",  // Exakt som i metadata!
                        "selection": {
                            "filter": "item",
                            "values": ["000007SF"]  // Folkmängden per månad
                        }
                    },
                    {
                        "code": "Tid",  // Tid, inte månad!
                        "selection": {
                            "filter": "item",
                            "values": ["2025M01", "2025M02", "2025M03", "2025M04", 
                                     "2025M05", "2025M06", "2025M07", "2025M08"]
                        }
                    }
                ],
                "response": {
                    "format": "json-stat2"
                }
            };
            
            console.log('📤 Skickar korrekt query:', JSON.stringify(query, null, 2));
            
            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(query)
                });
                
                console.log('📨 Response status:', response.status);
                
                if (!response.ok) {
                    const errorText = await response.text();
                    console.error('❌ Error:', errorText);
                    statusDiv.innerHTML = `<p class="error">❌ Fel: HTTP ${response.status}</p>`;
                    resultDiv.innerHTML = `<pre>${errorText}</pre>`;
                    return;
                }
                
                const data = await response.json();
                console.log('✅ SUCCESS! Data mottagen:', data);
                
                // Visa resultat
                const values = data.value;
                const months = Object.keys(data.dimension.Tid.category.label);
                
                let output = '<div class="success">✅ API FUNGERAR PERFEKT!</div>';
                output += '<div class="population">' + values[values.length - 1].toLocaleString('sv-SE') + '</div>';
                output += '<p style="text-align: center; color: #666;">Invånare i Karlskoga (augusti 2025)</p>';
                
                output += '<h3>📊 Befolkningsutveckling 2025:</h3><ul>';
                months.forEach((month, idx) => {
                    output += `<li><strong>${month}:</strong> ${values[idx].toLocaleString('sv-SE')} invånare</li>`;
                });
                output += '</ul>';
                
                output += '<p style="color: #27ae60; font-weight: bold; margin-top: 20px;">🎉 Nu kan du använda detta i din app!</p>';
                
                statusDiv.innerHTML = output;
                resultDiv.innerHTML = `<h4>📋 Fullständig JSON-stat2 data:</h4><pre>${JSON.stringify(data, null, 2)}</pre>`;
                
            } catch (error) {
                console.error('❌ Fetch error:', error);
                statusDiv.innerHTML = `<p class="error">❌ Fel: ${error.message}</p>`;
                resultDiv.innerHTML = `<pre>${error.stack}</pre>`;
            }
        }
        
        console.log('🎯 LÖSNING HITTAD!');
        console.log('✅ Använd stora bokstäver: Region, Alder, Kon, ContentsCode, Tid');
        console.log('✅ Använd TotSA (med stort A) för ålder');
        console.log('✅ Använd TotSa (med litet a) för kön');
    </script>
</body>
</html>
