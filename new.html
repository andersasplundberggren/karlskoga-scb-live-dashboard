<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📊 Karlskoga Befolkningsdashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        .header {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
            margin-bottom: 20px;
        }
        
        h1 {
            color: #667eea;
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .subtitle {
            color: #666;
            margin-bottom: 20px;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .stat-card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            text-align: center;
        }
        
        .stat-card.primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .stat-value {
            font-size: 3em;
            font-weight: bold;
            margin: 15px 0;
        }
        
        .stat-label {
            font-size: 1.1em;
            opacity: 0.9;
        }
        
        .stat-change {
            margin-top: 10px;
            font-size: 0.9em;
            padding: 5px 15px;
            border-radius: 20px;
            display: inline-block;
        }
        
        .stat-change.positive {
            background: rgba(40, 167, 69, 0.2);
            color: #28a745;
        }
        
        .stat-change.negative {
            background: rgba(220, 53, 69, 0.2);
            color: #dc3545;
        }
        
        .chart-container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 20px;
        }
        
        .chart-wrapper {
            position: relative;
            height: 400px;
        }
        
        .chart-title {
            font-size: 1.5em;
            color: #333;
            margin-bottom: 20px;
            text-align: center;
        }
        
        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            margin: 10px;
        }
        
        button:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #667eea;
            background: white;
            border-radius: 15px;
        }
        
        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 20px;
            border-radius: 8px;
            border-left: 4px solid #f5c6cb;
        }
        
        .method-badge {
            display: inline-block;
            background: #28a745;
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9em;
            margin: 10px 5px;
        }
        
        .data-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .info-box {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }
        
        .info-box h4 {
            color: #667eea;
            margin-bottom: 10px;
        }
        
        @media (max-width: 768px) {
            .stats-grid {
                grid-template-columns: 1fr;
            }
            
            .data-grid {
                grid-template-columns: 1fr;
            }
            
            .chart-wrapper {
                height: 300px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 Karlskoga Befolkningsdashboard</h1>
            <p class="subtitle">Komplett statistik från SCB - Historik, Aktuellt & Prognoser</p>
            <div>
                <span class="method-badge">✅ API v2 med GET</span>
                <span class="method-badge">📈 Chart.js</span>
                <span class="method-badge">🔮 Prognos till 2070</span>
            </div>
            <div style="margin-top: 20px;">
                <button onclick="hämtaAllaData()">🚀 Ladda Dashboard</button>
                <button onclick="location.reload()">🔄 Uppdatera</button>
            </div>
        </div>
        
        <div id="result"></div>
    </div>

    <script>
        let charts = {};
        
        async function hämtaAllaData() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '<div class="loading">⏳ Hämtar data från SCB... Detta kan ta några sekunder.</div>';
            
            try {
                // Hämta alla dataset parallellt
                const [aktuell, historisk, prognos, kon, alder] = await Promise.all([
                    hämtaAktuellData(),
                    hämtaHistoriskData(),
                    hämtaPrognosData(),
                    hämtaKönsfördelning(),
                    hämtaÅldersstatistik()
                ]);
                
                visaDashboard(aktuell, historisk, prognos, kon, alder);
            } catch (error) {
                console.error('❌ Fel vid datahämtning:', error);
                resultDiv.innerHTML = `
                    <div class="error">
                        <h3>❌ Fel vid datahämtning</h3>
                        <p>${error.message}</p>
                    </div>
                `;
            }
        }
        
        async function hämtaAktuellData() {
            const baseUrl = 'https://statistikdatabasen.scb.se/api/v2/tables/TAB6471/data';
            const params = new URLSearchParams({
                'lang': 'sv',
                'outputFormat': 'json-stat2'
            });
            
            params.append('valueCodes[ContentsCode]', '000007SF');
            params.append('valueCodes[Region]', '1883');
            params.append('valueCodes[Alder]', 'TotSA');
            params.append('valueCodes[Kon]', 'TotSa');
            params.append('valueCodes[Tid]', '2025M01,2025M02,2025M03,2025M04,2025M05,2025M06,2025M07,2025M08');
            params.append('codelist[Region]', 'vs_CKM03Kommun');
            params.append('codelist[Alder]', 'vs_CKM01AlderTot');
            
            const response = await fetch(`${baseUrl}?${params.toString()}`);
            if (!response.ok) throw new Error('Kunde inte hämta aktuell data');
            return await response.json();
        }
        
        async function hämtaHistoriskData() {
            // Hämta årlig data från 2000-2024
            const baseUrl = 'https://api.scb.se/OV0104/v1/doris/sv/ssd/START/BE/BE0101/BE0101A/BefolkningNy';
            
            const query = {
                "query": [
                    {
                        "code": "Region",
                        "selection": {
                            "filter": "vs:RegionKommun07",
                            "values": ["1883"]
                        }
                    },
                    {
                        "code": "Kon",
                        "selection": {
                            "filter": "item",
                            "values": ["1+2"]
                        }
                    },
                    {
                        "code": "ContentsCode",
                        "selection": {
                            "filter": "item",
                            "values": ["BE0101N1"]
                        }
                    },
                    {
                        "code": "Tid",
                        "selection": {
                            "filter": "item",
                            "values": Array.from({length: 25}, (_, i) => `${2000 + i}`)
                        }
                    }
                ],
                "response": {
                    "format": "json"
                }
            };
            
            const response = await fetch(baseUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(query)
            });
            
            if (!response.ok) throw new Error('Kunde inte hämta historisk data');
            return await response.json();
        }
        
        async function hämtaPrognosData() {
            // Hämta prognosdata till 2070
            const baseUrl = 'https://api.scb.se/OV0104/v1/doris/sv/ssd/START/BE/BE0401/BE0401A/BefProgSvD';
            
            const query = {
                "query": [
                    {
                        "code": "Region",
                        "selection": {
                            "filter": "vs:RegionKommun07EjAggr",
                            "values": ["1883"]
                        }
                    },
                    {
                        "code": "Kon",
                        "selection": {
                            "filter": "item",
                            "values": ["1+2"]
                        }
                    },
                    {
                        "code": "ContentsCode",
                        "selection": {
                            "filter": "item",
                            "values": ["000002VY"]
                        }
                    },
                    {
                        "code": "Tid",
                        "selection": {
                            "filter": "item",
                            "values": Array.from({length: 23}, (_, i) => `${2024 + i}`)
                        }
                    }
                ],
                "response": {
                    "format": "json"
                }
            };
            
            const response = await fetch(baseUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(query)
            });
            
            if (!response.ok) throw new Error('Kunde inte hämta prognosdata');
            return await response.json();
        }
        
        async function hämtaKönsfördelning() {
            const baseUrl = 'https://statistikdatabasen.scb.se/api/v2/tables/TAB6471/data';
            const params = new URLSearchParams({
                'lang': 'sv',
                'outputFormat': 'json-stat2'
            });
            
            params.append('valueCodes[ContentsCode]', '000007SF');
            params.append('valueCodes[Region]', '1883');
            params.append('valueCodes[Alder]', 'TotSA');
            params.append('valueCodes[Kon]', '1,2'); // Män och kvinnor separat
            params.append('valueCodes[Tid]', '2025M08');
            params.append('codelist[Region]', 'vs_CKM03Kommun');
            params.append('codelist[Alder]', 'vs_CKM01AlderTot');
            
            const response = await fetch(`${baseUrl}?${params.toString()}`);
            if (!response.ok) throw new Error('Kunde inte hämta könsfördelning');
            return await response.json();
        }
        
        async function hämtaÅldersstatistik() {
            const baseUrl = 'https://statistikdatabasen.scb.se/api/v2/tables/TAB6471/data';
            const params = new URLSearchParams({
                'lang': 'sv',
                'outputFormat': 'json-stat2'
            });
            
            params.append('valueCodes[ContentsCode]', '000007SF');
            params.append('valueCodes[Region]', '1883');
            params.append('valueCodes[Alder]', '0-4,5-9,10-14,15-19,20-24,25-29,30-34,35-39,40-44,45-49,50-54,55-59,60-64,65-69,70-74,75-79,80-84,85-89,90+');
            params.append('valueCodes[Kon]', 'TotSa');
            params.append('valueCodes[Tid]', '2025M08');
            params.append('codelist[Region]', 'vs_CKM03Kommun');
            params.append('codelist[Alder]', 'vs_CKM01Alder5');
            
            const response = await fetch(`${baseUrl}?${params.toString()}`);
            if (!response.ok) throw new Error('Kunde inte hämta åldersstatistik');
            return await response.json();
        }
        
        function visaDashboard(aktuell, historisk, prognos, kon, alder) {
            const resultDiv = document.getElementById('result');
            
            // Extrahera aktuell data
            const aktuellBefolkning = aktuell.value[aktuell.value.length - 1];
            const föregåendeMånad = aktuell.value[aktuell.value.length - 2];
            const förändring = aktuellBefolkning - föregåendeMånad;
            
            // Extrahera könsdata
            const män = kon.value[0];
            const kvinnor = kon.value[1];
            
            // Extrahera historisk data
            const historiskaÅr = historisk.data.map(d => d.key[3]);
            const historiskaVärden = historisk.data.map(d => parseInt(d.values[0]));
            
            // Extrahera prognosdata
            const prognosÅr = prognos.data.map(d => d.key[3]);
            const prognosVärden = prognos.data.map(d => parseInt(d.values[0]));
            
            // Beräkna statistik
            const historiskMin = Math.min(...historiskaVärden);
            const historiskMax = Math.max(...historiskaVärden);
            const genomsnittligFörändring = ((historiskaVärden[historiskaVärden.length - 1] - historiskaVärden[0]) / historiskaVärden.length).toFixed(0);
            
            // Bygg HTML
            let html = `
                <div class="stats-grid">
                    <div class="stat-card primary">
                        <div class="stat-label">Aktuell befolkning</div>
                        <div class="stat-value">${aktuellBefolkning.toLocaleString('sv-SE')}</div>
                        <div class="stat-label">Augusti 2025</div>
                        <div class="stat-change ${förändring >= 0 ? 'positive' : 'negative'}">
                            ${förändring >= 0 ? '+' : ''}${förändring} sen förra månaden
                        </div>
                    </div>
                    
                    <div class="stat-card">
                        <div class="stat-label">👨 Män</div>
                        <div class="stat-value">${män.toLocaleString('sv-SE')}</div>
                        <div class="stat-label">${((män / aktuellBefolkning) * 100).toFixed(1)}%</div>
                    </div>
                    
                    <div class="stat-card">
                        <div class="stat-label">👩 Kvinnor</div>
                        <div class="stat-value">${kvinnor.toLocaleString('sv-SE')}</div>
                        <div class="stat-label">${((kvinnor / aktuellBefolkning) * 100).toFixed(1)}%</div>
                    </div>
                    
                    <div class="stat-card">
                        <div class="stat-label">📊 Snitt förändring/år</div>
                        <div class="stat-value">${genomsnittligFörändring}</div>
                        <div class="stat-label">2000-2024</div>
                    </div>
                </div>
                
                <div class="chart-container">
                    <h3 class="chart-title">📈 Befolkningsutveckling 2000-2070</h3>
                    <div class="chart-wrapper">
                        <canvas id="historikChart"></canvas>
                    </div>
                </div>
                
                <div class="data-grid">
                    <div class="chart-container">
                        <h3 class="chart-title">👥 Könsfördelning 2025</h3>
                        <div class="chart-wrapper" style="height: 300px;">
                            <canvas id="konChart"></canvas>
                        </div>
                    </div>
                    
                    <div class="chart-container">
                        <h3 class="chart-title">🎂 Åldersfördelning 2025</h3>
                        <div class="chart-wrapper" style="height: 300px;">
                            <canvas id="alderChart"></canvas>
                        </div>
                    </div>
                </div>
                
                <div class="chart-container">
                    <h3 class="chart-title">📅 Månatlig utveckling 2025</h3>
                    <div class="chart-wrapper" style="height: 300px;">
                        <canvas id="manadChart"></canvas>
                    </div>
                </div>
                
                <div class="data-grid">
                    <div class="info-box">
                        <h4>📊 Historisk data</h4>
                        <p><strong>Högsta:</strong> ${historiskMax.toLocaleString('sv-SE')} (${historiskaÅr[historiskaVärden.indexOf(historiskMax)]})</p>
                        <p><strong>Lägsta:</strong> ${historiskMin.toLocaleString('sv-SE')} (${historiskaÅr[historiskaVärden.indexOf(historiskMin)]})</p>
                        <p><strong>Förändring:</strong> ${(historiskaVärden[historiskaVärden.length - 1] - historiskaVärden[0]).toLocaleString('sv-SE')} (2000-2024)</p>
                    </div>
                    
                    <div class="info-box">
                        <h4>🔮 Prognos till 2070</h4>
                        <p><strong>2046:</strong> ${prognosVärden[prognosÅr.indexOf('2046')]?.toLocaleString('sv-SE') || 'N/A'}</p>
                        <p><strong>2070:</strong> ${prognosVärden[prognosVärden.length - 1].toLocaleString('sv-SE')}</p>
                        <p><strong>Beräknad förändring:</strong> ${(prognosVärden[prognosVärden.length - 1] - aktuellBefolkning).toLocaleString('sv-SE')}</p>
                    </div>
                </div>
            `;
            
            resultDiv.innerHTML = html;
            
            // Skapa diagram
            setTimeout(() => {
                skapaHistorikDiagram(historiskaÅr, historiskaVärden, prognosÅr, prognosVärden, aktuellBefolkning);
                skapaKönsDiagram(män, kvinnor);
                skapaÅldersDiagram(alder);
                skapaMånadsDiagram(aktuell);
            }, 100);
        }
        
        function skapaHistorikDiagram(historiskaÅr, historiskaVärden, prognosÅr, prognosVärden, aktuell) {
            const ctx = document.getElementById('historikChart').getContext('2d');
            
            if (charts.historik) charts.historik.destroy();
            
            charts.historik = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: [...historiskaÅr, ...prognosÅr],
                    datasets: [
                        {
                            label: 'Historisk data',
                            data: [...historiskaVärden, ...Array(prognosÅr.length).fill(null)],
                            borderColor: '#667eea',
                            backgroundColor: 'rgba(102, 126, 234, 0.1)',
                            borderWidth: 3,
                            fill: true,
                            tension: 0.4
                        },
                        {
                            label: 'Prognos',
                            data: [...Array(historiskaÅr.length - 1).fill(null), aktuell, ...prognosVärden],
                            borderColor: '#764ba2',
                            backgroundColor: 'rgba(118, 75, 162, 0.1)',
                            borderWidth: 3,
                            borderDash: [5, 5],
                            fill: true,
                            tension: 0.4
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            display: true,
                            position: 'top'
                        },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    return context.dataset.label + ': ' + context.parsed.y.toLocaleString('sv-SE') + ' invånare';
                                }
                            }
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: false,
                            ticks: {
                                callback: function(value) {
                                    return value.toLocaleString('sv-SE');
                                }
                            }
                        }
                    }
                }
            });
        }
        
        function skapaKönsDiagram(män, kvinnor) {
            const ctx = document.getElementById('konChart').getContext('2d');
            
            if (charts.kon) charts.kon.destroy();
            
            charts.kon = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['Män', 'Kvinnor'],
                    datasets: [{
                        data: [män, kvinnor],
                        backgroundColor: ['#667eea', '#764ba2'],
                        borderWidth: 0
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'bottom'
                        },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    const total = män + kvinnor;
                                    const percentage = ((context.parsed / total) * 100).toFixed(1);
                                    return context.label + ': ' + context.parsed.toLocaleString('sv-SE') + ' (' + percentage + '%)';
                                }
                            }
                        }
                    }
                }
            });
        }
        
        function skapaÅldersDiagram(alderData) {
            const ctx = document.getElementById('alderChart').getContext('2d');
            
            const labels = Object.values(alderData.dimension.Alder.category.label);
            const values = alderData.value;
            
            if (charts.alder) charts.alder.destroy();
            
            charts.alder = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Antal invånare',
                        data: values,
                        backgroundColor: 'rgba(102, 126, 234, 0.7)',
                        borderColor: '#667eea',
                        borderWidth: 1
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            display: false
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: {
                                callback: function(value) {
                                    return value.toLocaleString('sv-SE');
                                }
                            }
                        },
                        x: {
                            ticks: {
                                maxRotation: 45,
                                minRotation: 45
                            }
                        }
                    }
                }
            });
        }
        
        function skapaMånadsDiagram(aktuellData) {
            const ctx = document.getElementById('manadChart').getContext('2d');
            
            const labels = Object.values(aktuellData.dimension.Tid.category.label);
            const values = aktuellData.value;
            
            if (charts.manad) charts.manad.destroy();
            
            charts.manad = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Befolkning',
                        data: values,
                        borderColor: '#667eea',
                        backgroundColor: 'rgba(102, 126, 234, 0.1)',
                        borderWidth: 3,
                        fill: true,
                        tension: 0.4,
                        pointRadius: 5,
                        pointHoverRadius: 7
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            display: false
                        },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    return context.parsed.y.toLocaleString('sv-SE') + ' invånare';
                                }
                            }
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: false,
                            ticks: {
                                callback: function(value) {
                                    return value.toLocaleString('sv-SE');
                                }
                            }
                        }
                    }
                }
            });
        }
        
        console.log('📊 Karlskoga Dashboard initierad');
        console.log('✅ Chart.js laddad');
        console.log('✅ Redo att hämta data från SCB');
    </script>
</body>
</html>
