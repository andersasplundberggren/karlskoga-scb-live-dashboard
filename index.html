<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Karlskoga Befolkning</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 {
            color: #667eea;
            text-align: center;
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }
        .population-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            margin: 30px 0;
        }
        .population-number {
            font-size: 4em;
            font-weight: bold;
            margin: 20px 0;
        }
        .population-label {
            font-size: 1.2em;
            opacity: 0.9;
        }
        .data-table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
        }
        .data-table th {
            background: #f8f9fa;
            padding: 15px;
            text-align: left;
            border-bottom: 2px solid #dee2e6;
        }
        .data-table td {
            padding: 12px 15px;
            border-bottom: 1px solid #dee2e6;
        }
        .data-table tr:hover {
            background: #f8f9fa;
        }
        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            margin: 20px 0;
            transition: all 0.3s;
        }
        button:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: #667eea;
        }
        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 20px;
            border-radius: 8px;
            border-left: 4px solid #f5c6cb;
        }
        .success {
            background: #d4edda;
            color: #155724;
            padding: 20px;
            border-radius: 8px;
            border-left: 4px solid #c3e6cb;
            margin: 20px 0;
        }
        pre {
            background: #2c3e50;
            color: #ecf0f1;
            padding: 20px;
            border-radius: 8px;
            overflow-x: auto;
            font-size: 0.9em;
        }
        .method-badge {
            display: inline-block;
            background: #28a745;
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9em;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏘️ Karlskoga kommun</h1>
        <p class="subtitle">Befolkningsstatistik från SCB API v2</p>
        <p class="method-badge">✅ Använder GET-metod (fungerar med CORS!)</p>
        
        <button onclick="hämtaData()">📊 Hämta aktuell befolkningsdata</button>
        
        <div id="result"></div>
    </div>

    <script>
        async function hämtaData() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '<div class="loading">⏳ Hämtar data från SCB...</div>';
            
            // API v2 använder GET med query parameters!
            const baseUrl = 'https://statistikdatabasen.scb.se/api/v2/tables/TAB6471/data';
            
            // Bygg URL med query parameters
            const params = new URLSearchParams({
                'lang': 'sv',
                'outputFormat': 'json-stat2'
            });
            
            // Value codes - specifika värden vi vill ha
            params.append('valueCodes[ContentsCode]', '000007SF');
            params.append('valueCodes[Region]', '1883'); // Karlskoga
            params.append('valueCodes[Alder]', 'TotSA'); // Totalt alla åldrar
            params.append('valueCodes[Kon]', 'TotSa'); // Totalt män och kvinnor
            params.append('valueCodes[Tid]', '2025M01,2025M02,2025M03,2025M04,2025M05,2025M06,2025M07,2025M08');
            
            // Codelist - filtren från SCB:s egen query
            params.append('codelist[Region]', 'vs_CKM03Kommun');
            params.append('codelist[Alder]', 'vs_CKM01AlderTot');
            
            const url = `${baseUrl}?${params.toString()}`;
            
            console.log('📤 Hämtar från URL:', url);
            
            try {
                const response = await fetch(url);
                
                console.log('📨 Response status:', response.status);
                console.log('📨 Response headers:', [...response.headers.entries()]);
                
                if (!response.ok) {
                    const errorText = await response.text();
                    console.error('❌ Error:', errorText);
                    resultDiv.innerHTML = `
                        <div class="error">
                            <h3>❌ Fel vid hämtning</h3>
                            <p>HTTP Status: ${response.status}</p>
                            <pre>${errorText}</pre>
                        </div>
                    `;
                    return;
                }
                
                const data = await response.json();
                console.log('✅ Data mottagen:', data);
                
                // Visa resultatet
                visaData(data);
                
            } catch (error) {
                console.error('❌ Fetch error:', error);
                resultDiv.innerHTML = `
                    <div class="error">
                        <h3>❌ Nätverksfel</h3>
                        <p>${error.message}</p>
                    </div>
                `;
            }
        }
        
        function visaData(data) {
            const resultDiv = document.getElementById('result');
            
            // Extrahera data
            const values = data.value;
            const timeLabels = data.dimension.Tid.category.label;
            const times = Object.keys(timeLabels);
            
            // Senaste värdet
            const latestValue = values[values.length - 1];
            const latestTime = times[times.length - 1];
            
            // Bygg HTML
            let html = `
                <div class="success">
                    <h3>✅ Data hämtad från SCB API v2!</h3>
                    <p>Fungerar perfekt med GET-metod - inga CORS-problem!</p>
                </div>
                
                <div class="population-card">
                    <div class="population-label">Karlskoga kommun</div>
                    <div class="population-number">${latestValue.toLocaleString('sv-SE')}</div>
                    <div class="population-label">invånare (${timeLabels[latestTime]})</div>
                </div>
                
                <h3>📊 Befolkningsutveckling 2025</h3>
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Månad</th>
                            <th>Befolkning</th>
                            <th>Förändring</th>
                        </tr>
                    </thead>
                    <tbody>
            `;
            
            times.forEach((time, idx) => {
                const change = idx > 0 ? values[idx] - values[idx-1] : 0;
                const changeText = change > 0 ? `+${change}` : change;
                const changeColor = change > 0 ? '#28a745' : (change < 0 ? '#dc3545' : '#6c757d');
                
                html += `
                    <tr>
                        <td><strong>${timeLabels[time]}</strong></td>
                        <td>${values[idx].toLocaleString('sv-SE')} invånare</td>
                        <td style="color: ${changeColor}; font-weight: bold;">${changeText}</td>
                    </tr>
                `;
            });
            
            html += `
                    </tbody>
                </table>
                
                <h3>🔍 Teknisk information</h3>
                <p><strong>API-metod:</strong> GET (ingen CORS-problematik!)</p>
                <p><strong>URL:</strong> statistikdatabasen.scb.se/api/v2/tables/TAB6471/data</p>
                <p><strong>Format:</strong> JSON-stat2</p>
                <p><strong>Datakälla:</strong> SCB - Statistiska Centralbyrån</p>
                
                <details style="margin-top: 20px;">
                    <summary style="cursor: pointer; padding: 10px; background: #f8f9fa; border-radius: 5px;">
                        <strong>📋 Visa fullständig JSON-data</strong>
                    </summary>
                    <pre>${JSON.stringify(data, null, 2)}</pre>
                </details>
            `;
            
            resultDiv.innerHTML = html;
        }
        
        console.log('🎯 Karlskoga Befolkningsvisualisering');
        console.log('✅ Använder GET-metod med query parameters');
        console.log('✅ Ingen CORS-problematik!');
    </script>
</body>
</html>
