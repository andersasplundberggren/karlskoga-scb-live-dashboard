<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Karlskoga Befolkningsstatistik</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #e0e0e0;
        }
        .header h1 {
            color: #333;
            font-size: 2.2em;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        .control-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }
        select, button {
            padding: 10px 16px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            background: white;
            transition: all 0.3s ease;
        }
        button {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            cursor: pointer;
            font-weight: 600;
        }
        button:hover { transform: translateY(-2px); }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: white;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease;
        }
        .stat-card:hover { transform: translateY(-3px); }
        .stat-card h3 {
            color: #667eea;
            font-size: 0.9em;
            margin-bottom: 8px;
        }
        .stat-card .value {
            font-size: 1.6em;
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
        }
        .stat-card .change {
            font-size: 0.8em;
            color: #666;
        }
        .chart-container {
            background: white;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            height: 400px;
        }
        .chart-title {
            font-size: 1.2em;
            color: #333;
            margin-bottom: 15px;
            text-align: center;
            font-weight: 600;
        }
        .chart-wrapper {
            position: relative;
            height: 320px;
        }
        @media (max-width: 768px) {
            .container { padding: 15px; }
            .stats-grid { grid-template-columns: 1fr 1fr; }
            .chart-container { height: 300px; }
            .chart-wrapper { height: 220px; }
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 Karlskoga Befolkningsstatistik</h1>
            <p>Simulerad SCB-data för demografisk analys</p>
        </div>

        <div class="controls">
            <div class="control-group">
                <label>Datatyp:</label>
                <select id="dataSelect" onchange="updateVisualization()">
                    <option value="population">Befolkningsmängd</option>
                    <option value="migration">In- och utflyttning</option>
                    <option value="births_deaths">Födda och döda</option>
                    <option value="age_groups">Åldersfördelning (10-år)</option>
                    <option value="prognosis">SCB Prognos till 2070</option>
                    <option value="net_change">Nettoförändringar</option>
                </select>
            </div>
            <div class="control-group">
                <label>Diagramtyp:</label>
                <select id="chartType" onchange="updateVisualization()">
                    <option value="line">Linje</option>
                    <option value="bar">Stapel</option>
                </select>
            </div>
            <div class="control-group">
                <label>&nbsp;</label>
                <button onclick="generateNewData()">Ny simulering</button>
            </div>
        </div>

        <div class="stats-grid" id="statsContainer">
            <!-- Statistikkort genereras här -->
        </div>

        <div class="chart-container">
            <div class="chart-title" id="chartTitle">Befolkningsmängd över tid</div>
            <div class="chart-wrapper">
                <canvas id="mainChart"></canvas>
            </div>
        </div>

        <div class="chart-container">
            <div class="chart-title">Åldersfördelning (senaste året)</div>
            <div class="chart-wrapper">
                <canvas id="ageChart"></canvas>
            </div>
        </div>
    </div>

    <script>
        // Global data
        let data = {};
        let mainChart = null;
        let ageChart = null;

        // Generera simulerad data för Karlskoga
        function generateData() {
            const years = [];
            const population = {};
            const immigration = {};
            const emigration = {};
            const births = {};
            const deaths = {};
            const ageGroups = {};
            const prognosis = {};
            
            let currentPop = 29800;
            
            // Historisk data 2010-2025
            for (let year = 2010; year <= 2025; year++) {
                const y = year.toString();
                years.push(y);
                
                const imm = 280 + Math.floor(Math.random() * 40 - 20);
                const em = 320 + Math.floor(Math.random() * 40 - 20);
                const b = 240 + Math.floor(Math.random() * 30 - 15);
                const d = 380 + Math.floor(Math.random() * 30 - 15);
                
                currentPop += (imm - em + b - d) + Math.floor(Math.random() * 20 - 10);
                currentPop = Math.max(currentPop, 28000);
                
                population[y] = currentPop;
                immigration[y] = imm;
                emigration[y] = em;
                births[y] = b;
                deaths[y] = d;
                
                // Åldersgrupper
                ageGroups[y] = {
                    '0-9': Math.round(currentPop * 0.09),
                    '10-19': Math.round(currentPop * 0.11),
                    '20-29': Math.round(currentPop * 0.12),
                    '30-39': Math.round(currentPop * 0.13),
                    '40-49': Math.round(currentPop * 0.14),
                    '50-59': Math.round(currentPop * 0.15),
                    '60-69': Math.round(currentPop * 0.13),
                    '70-79': Math.round(currentPop * 0.09),
                    '80+': Math.round(currentPop * 0.04)
                };
            }
            
            // Prognos 2026-2070 (var 5:e år)
            let progPop = currentPop;
            for (let year = 2030; year <= 2070; year += 5) {
                progPop *= 0.985; // 1.5% minskning per 5 år
                prognosis[year.toString()] = Math.round(progPop);
            }
            
            return {
                years,
                population,
                immigration,
                emigration,
                births,
                deaths,
                ageGroups,
                prognosis
            };
        }

        // Uppdatera statistikkort
        function updateStats() {
            const container = document.getElementById('statsContainer');
            const latestYear = data.years[data.years.length - 1];
            const pop = data.population[latestYear];
            const imm = data.immigration[latestYear];
            const em = data.emigration[latestYear];
            const births = data.births[latestYear];
            const deaths = data.deaths[latestYear];
            const netMig = imm - em;
            const natChange = births - deaths;
            
            container.innerHTML = `
                <div class="stat-card">
                    <h3>Befolkning ${latestYear}</h3>
                    <div class="value">${pop.toLocaleString()}</div>
                    <div class="change">Total</div>
                </div>
                <div class="stat-card">
                    <h3>Inflyttade</h3>
                    <div class="value">${imm}</div>
                    <div class="change">${latestYear}</div>
                </div>
                <div class="stat-card">
                    <h3>Utflyttade</h3>
                    <div class="value">${em}</div>
                    <div class="change">${latestYear}</div>
                </div>
                <div class="stat-card">
                    <h3>Nettomigration</h3>
                    <div class="value">${netMig > 0 ? '+' : ''}${netMig}</div>
                    <div class="change">${latestYear}</div>
                </div>
                <div class="stat-card">
                    <h3>Födda</h3>
                    <div class="value">${births}</div>
                    <div class="change">${latestYear}</div>
                </div>
                <div class="stat-card">
                    <h3>Döda</h3>
                    <div class="value">${deaths}</div>
                    <div class="change">${latestYear}</div>
                </div>
                <div class="stat-card">
                    <h3>Naturlig förändring</h3>
                    <div class="value">${natChange > 0 ? '+' : ''}${natChange}</div>
                    <div class="change">${latestYear}</div>
                </div>
                <div class="stat-card">
                    <h3>Prognos 2070</h3>
                    <div class="value">${Math.round(data.prognosis['2070'] || 0).toLocaleString()}</div>
                    <div class="change">SCB</div>
                </div>
            `;
        }

        // Förbered data för diagram
        function prepareChartData() {
            const selection = document.getElementById('dataSelect').value;
            
            switch(selection) {
                case 'population':
                    return {
                        labels: data.years,
                        datasets: [{
                            label: 'Befolkning',
                            data: data.years.map(y => data.population[y]),
                            borderColor: '#667eea',
                            backgroundColor: 'rgba(102, 126, 234, 0.1)',
                            borderWidth: 2,
                            tension: 0.4
                        }]
                    };
                    
                case 'migration':
                    return {
                        labels: data.years,
                        datasets: [
                            {
                                label: 'Inflyttade',
                                data: data.years.map(y => data.immigration[y]),
                                borderColor: '#28a745',
                                backgroundColor: 'rgba(40, 167, 69, 0.1)',
                                borderWidth: 2
                            },
                            {
                                label: 'Utflyttade', 
                                data: data.years.map(y => data.emigration[y]),
                                borderColor: '#dc3545',
                                backgroundColor: 'rgba(220, 53, 69, 0.1)',
                                borderWidth: 2
                            }
                        ]
                    };
                    
                case 'births_deaths':
                    return {
                        labels: data.years,
                        datasets: [
                            {
                                label: 'Födda',
                                data: data.years.map(y => data.births[y]),
                                borderColor: '#007bff',
                                backgroundColor: 'rgba(0, 123, 255, 0.1)',
                                borderWidth: 2
                            },
                            {
                                label: 'Döda',
                                data: data.years.map(y => data.deaths[y]),
                                borderColor: '#6c757d',
                                backgroundColor: 'rgba(108, 117, 125, 0.1)',
                                borderWidth: 2
                            }
                        ]
                    };
                    
                case 'age_groups':
                    const latestYear = data.years[data.years.length - 1];
                    const ages = data.ageGroups[latestYear];
                    return {
                        labels: Object.keys(ages).map(k => k + ' år'),
                        datasets: [{
                            data: Object.values(ages),
                            backgroundColor: [
                                '#FF6384', '#36A2EB', '#FFCE56', '#4BC0C0', '#9966FF',
                                '#FF9F40', '#C9CBCF', '#4BC0C0', '#FF6384'
                            ]
                        }]
                    };
                    
                case 'prognosis':
                    const histYears = data.years;
                    const progYears = Object.keys(data.prognosis);
                    const allYears = [...histYears, ...progYears];
                    
                    return {
                        labels: allYears,
                        datasets: [
                            {
                                label: 'Historisk',
                                data: allYears.map(y => histYears.includes(y) ? data.population[y] : null),
                                borderColor: '#667eea',
                                backgroundColor: 'rgba(102, 126, 234, 0.1)',
                                borderWidth: 2,
                                spanGaps: false
                            },
                            {
                                label: 'Prognos',
                                data: allYears.map(y => {
                                    if (progYears.includes(y)) return data.prognosis[y];
                                    if (y === data.years[data.years.length - 1]) return data.population[y];
                                    return null;
                                }),
                                borderColor: '#ff9800',
                                backgroundColor: 'rgba(255, 152, 0, 0.1)',
                                borderWidth: 2,
                                borderDash: [5, 5],
                                spanGaps: true
                            }
                        ]
                    };
                    
                case 'net_change':
                    return {
                        labels: data.years,
                        datasets: [
                            {
                                label: 'Nettomigration',
                                data: data.years.map(y => data.immigration[y] - data.emigration[y]),
                                borderColor: '#17a2b8',
                                backgroundColor: 'rgba(23, 162, 184, 0.1)',
                                borderWidth: 2
                            },
                            {
                                label: 'Naturlig förändring',
                                data: data.years.map(y => data.births[y] - data.deaths[y]),
                                borderColor: '#28a745',
                                backgroundColor: 'rgba(40, 167, 69, 0.1)',
                                borderWidth: 2
                            }
                        ]
                    };
            }
        }

        // Skapa huvuddiagram
        function createMainChart() {
            const ctx = document.getElementById('mainChart').getContext('2d');
            const chartData = prepareChartData();
            const chartType = document.getElementById('chartType').value;
            const isAge = document.getElementById('dataSelect').value === 'age_groups';
            
            if (mainChart) mainChart.destroy();
            
            mainChart = new Chart(ctx, {
                type: isAge ? 'doughnut' : chartType,
                data: chartData,
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: isAge ? {} : {
                        y: {
                            beginAtZero: true,
                            ticks: {
                                callback: value => value.toLocaleString()
                            }
                        }
                    },
                    plugins: {
                        legend: {
                            display: chartData.datasets.length > 1 || isAge,
                            position: isAge ? 'bottom' : 'top'
                        }
                    }
                }
            });
        }

        // Skapa åldersdiagram
        function createAgeChart() {
            const ctx = document.getElementById('ageChart').getContext('2d');
            const latestYear = data.years[data.years.length - 1];
            const ages = data.ageGroups[latestYear];
            
            if (ageChart) ageChart.destroy();
            
            ageChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: Object.keys(ages).map(k => k + ' år'),
                    datasets: [{
                        data: Object.values(ages),
                        backgroundColor: [
                            '#FF6384', '#36A2EB', '#FFCE56', '#4BC0C0', '#9966FF',
                            '#FF9F40', '#C9CBCF', '#4BC0C0', '#FF6384'
                        ]
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'bottom',
                            labels: { font: { size: 11 } }
                        }
                    }
                }
            });
        }

        // Uppdatera titel
        function updateTitle() {
            const titles = {
                population: 'Befolkningsmängd över tid',
                migration: 'In- och utflyttning per år',
                births_deaths: 'Födda och döda per år',
                age_groups: 'Åldersfördelning per 10-årsgrupper',
                prognosis: 'SCB:s befolkningsprognos till 2070',
                net_change: 'Nettoförändringar per år'
            };
            
            const selection = document.getElementById('dataSelect').value;
            document.getElementById('chartTitle').textContent = titles[selection];
        }

        // Event handlers
        function updateVisualization() {
            updateTitle();
            createMainChart();
        }

        function generateNewData() {
            data = generateData();
            updateStats();
            updateVisualization();
            createAgeChart();
        }

        // Initiera
        document.addEventListener('DOMContentLoaded', function() {
            data = generateData();
            updateStats();
            updateVisualization();
            createAgeChart();
        });
    </script>
</body>
</html>
